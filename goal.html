<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F4F0E6">
<meta name="robots" content="noindex">
<title>골인 기록 | 으랏차차</title>
<style>
  /* 2026-11-24 개편: 팀 색 버튼 · 누른 뒤 10초 동안 득점 종류 고치기 · 쿼터 선택 없음(영상 촬영 시각으로 맞춘다) · 밝은 네오 브루탈리즘 */
  :root {
    color-scheme: light;
    --bg: #F4F0E6; --card: #fff; --ink: #111; --muted: #5b5b5b; --line: #cfc8b8;
    --yel: #FFD338; --mint: #45E0B4; --red: #FF6B57; --vio: #B59CFF;
    --BLK: #141414; --BLK-t: #fff; --WHT: #ffffff; --WHT-t: #111; --GRY: #6E747C; --GRY-t: #fff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 17px; touch-action: manipulation; -webkit-user-select: none; user-select: none;
    display: flex; flex-direction: column; min-height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; background: var(--card); border: 3px solid var(--ink); }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 3px solid var(--ink); background: var(--yel); }
  header .title { font-weight: 900; font-size: 19px; white-space: nowrap; }
  header .date { font-size: 14px; font-weight: 700; white-space: nowrap; }
  header .sp { flex: 1; }
  .sync { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #1fbf73; border: 2px solid var(--ink); }
  .dot.wait { background: #ff9f1c; }
  .dot.off { background: var(--red); }
  main { flex: 1; display: flex; flex-direction: column; padding: 14px; gap: 12px; min-height: 0; }
  .hidden { display: none !important; }
  .shadow { box-shadow: 5px 5px 0 var(--ink); }

  /* 기록자 선택 */
  .pick h2 { margin: 2px 0; font-size: 23px; font-weight: 900; }
  .pick .sub { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .names { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .names button { padding: 12px 2px; font-size: 17px; font-weight: 800; box-shadow: 3px 3px 0 var(--ink); }
  .names button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .names button.other { grid-column: 1 / -1; font-weight: 700; font-size: 15px; background: var(--bg); }
  .other-box { display: flex; gap: 8px; margin-top: 10px; }
  .other-box input { flex: 1; min-width: 0; font: inherit; font-size: 18px; padding: 12px; border: 3px solid var(--ink); background: #fff; color: var(--ink); -webkit-user-select: text; user-select: text; }
  .other-box button { background: var(--mint); padding: 0 18px; font-weight: 900; }

  /* 공통 */
  .who { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .who b { font-size: 17px; }
  .who .chg { margin-left: auto; border: 0; background: transparent; text-decoration: underline; font-size: 14px; padding: 6px 0; color: var(--muted); }
  .tchip { display: inline-block; font-weight: 900; font-size: 13px; padding: 1px 7px; border: 2px solid var(--ink); letter-spacing: .5px; }
  .tchip.BLK { background: var(--BLK); color: var(--BLK-t); } .tchip.WHT { background: var(--WHT); color: var(--WHT-t); } .tchip.GRY { background: var(--GRY); color: var(--GRY-t); }

  /* 자리 · 좌우 팀 설정 (준비 화면 · 기록 중 「바꾸기」) */
  .setup { display: flex; flex-direction: column; gap: 10px; }
  .setup .lbl { font-weight: 900; font-size: 15px; }
  .setup .help { font-size: 13px; color: var(--muted); }
  .spots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .spots button { padding: 10px 4px; font-size: 16px; font-weight: 900; line-height: 1.25; box-shadow: none; opacity: .45; }
  .spots button small { display: block; font-size: 12px; font-weight: 700; }
  .spots button.on { opacity: 1; background: var(--vio); box-shadow: 3px 3px 0 var(--ink); }
  .spots .unk { grid-column: 1 / -1; padding: 5px; font-size: 13px; font-weight: 700; }
  .spots .unk.on { background: #e9e5da; }
  .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sides .col { display: flex; flex-direction: column; gap: 6px; }
  .sides .col > span { font-weight: 900; font-size: 15px; }
  .sides .col:last-child > span { text-align: right; }
  .sides button { padding: 9px 0; font-size: 19px; font-weight: 900; letter-spacing: 1px; opacity: .3; box-shadow: none; }
  .sides button.on { opacity: 1; box-shadow: 3px 3px 0 var(--ink); }
  .sides .BLK { background: var(--BLK); color: var(--BLK-t); } .sides .WHT { background: var(--WHT); color: var(--WHT-t); } .sides .GRY { background: var(--GRY); color: var(--GRY-t); }
  .panel { border: 3px solid var(--ink); background: var(--card); padding: 10px; box-shadow: 4px 4px 0 var(--ink); }
  .panel .done { margin-top: 10px; width: 100%; padding: 10px; font-weight: 900; background: var(--mint); }
  .cur { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; flex-wrap: wrap; }
  .cur .sp { flex: 1; }
  .cur button { padding: 6px 10px; font-size: 14px; font-weight: 800; border-width: 2px; box-shadow: 2px 2px 0 var(--ink); }
  .cur button.arm { background: var(--yel); }
  .big {
    flex: 1; min-height: 200px; font-weight: 900; letter-spacing: 1px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-shadow: 6px 6px 0 var(--ink);
  }
  .big:active { transform: translate(3px, 3px); box-shadow: 3px 3px 0 var(--ink); }
  .big .main { font-size: 52px; line-height: 1.05; }
  .big .hint { font-size: 15px; font-weight: 700; letter-spacing: 0; }
  .big.start { background: var(--mint); }

  /* 기록 화면 */
  .bar { display: flex; align-items: center; gap: 10px; }
  .bar .rec { font-weight: 900; font-size: 18px; display: flex; align-items: center; gap: 6px; }
  .bar .rec::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--red); border: 2px solid var(--ink); animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .bar .rec::before { animation: none; } }
  .bar .elapsed { font-variant-numeric: tabular-nums; font-weight: 800; background: var(--ink); color: #fff; padding: 1px 8px; }
  .bar .cnt { font-size: 14px; font-weight: 700; color: var(--muted); }
  .bar .end { margin-left: auto; padding: 8px 12px; font-size: 15px; font-weight: 800; box-shadow: 3px 3px 0 var(--ink); }
  .bar .end.arm { background: var(--red); }
  .goals { flex: 1; display: grid; gap: 10px; min-height: 230px; }
  .goals.n2 { grid-template-columns: 1fr 1fr; }
  .goals.n3 { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .gbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 900; box-shadow: 6px 6px 0 var(--ink); }
  .gbtn:active, .gbtn.flash { transform: translate(3px, 3px); box-shadow: 3px 3px 0 var(--ink); filter: brightness(1.25); }
  .gbtn .tn { font-size: 40px; letter-spacing: 2px; line-height: 1; }
  .goals.n3 .gbtn .tn { font-size: 30px; letter-spacing: 1px; }
  .gbtn .gl { font-size: 30px; line-height: 1; }
  .gbtn .sm { font-size: 13px; font-weight: 700; opacity: .8; }
  .gbtn.BLK { background: var(--BLK); color: var(--BLK-t); } .gbtn.WHT { background: var(--WHT); color: var(--WHT-t); } .gbtn.GRY { background: var(--GRY); color: var(--GRY-t); }

  /* 누른 뒤 10초 고치기 */
  .amend { border: 3px solid var(--ink); background: var(--yel); padding: 8px 10px; display: flex; flex-direction: column; gap: 7px; box-shadow: 4px 4px 0 var(--ink); }
  .amend .head { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 17px; }
  .amend .head .left { margin-left: auto; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .amend .timer { height: 6px; background: var(--ink); transform-origin: left; }
  .amend .opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .amend .opts button { padding: 11px 0; font-size: 16px; font-weight: 900; }
  .amend .opts button.on { background: var(--ink); color: #fff; }
  .amend .opts button.cancel { background: var(--red); }

  /* 기록 줄 */
  .log { max-height: 32vh; overflow-y: auto; border-top: 3px solid var(--ink); }
  .log .row { display: flex; align-items: center; gap: 8px; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .log .row .n { font-weight: 900; min-width: 26px; font-variant-numeric: tabular-nums; }
  .log .row .tchip, .log .row .kchip { cursor: pointer; }
  .log .row .tchip.none { background: #eee; color: var(--muted); }
  .kchip { font-weight: 800; font-size: 13px; padding: 1px 7px; border: 2px solid var(--ink); background: var(--card); min-width: 36px; text-align: center; }
  .kchip.k3 { background: var(--vio); } .kchip.kFT { background: var(--mint); } .kchip.k21, .kchip.k31 { background: var(--yel); }
  .log .row .t { font-variant-numeric: tabular-nums; }
  .log .row .e { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .log .row .st { font-size: 12px; font-weight: 800; color: #b45309; }
  .log .row .del { margin-left: auto; border-width: 2px; padding: 3px 10px; font-size: 13px; font-weight: 700; }
  .log .row .del.arm { background: var(--red); }
  .log .empty { color: var(--muted); font-size: 14px; padding: 10px 2px; }
  .log .day { font-size: 13px; font-weight: 800; padding: 8px 2px 4px; }
  .others { color: var(--muted); font-size: 13px; }
  .toast {
    position: fixed; left: 50%; top: 16%; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 12px 22px; font-size: 22px; font-weight: 900; pointer-events: none; opacity: 0; transition: opacity .15s;
    border: 3px solid var(--yel);
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <span class="title">골인 기록</span>
  <span class="date" id="today"></span>
  <span class="sp"></span>
  <span class="sync"><span class="dot" id="dot"></span><span id="syncTxt">연결 확인 중</span></span>
</header>

<main>
  <!-- 1. 기록자 선택 -->
  <section class="pick hidden" id="vPick">
    <h2>누가 기록하나요?</h2>
    <div class="sub" id="rosterSub">명단 불러오는 중</div>
    <div class="names" id="names"></div>
    <div class="other-box hidden" id="otherBox">
      <input id="otherName" maxlength="20" placeholder="이름 입력" autocomplete="off">
      <button id="otherOk">확인</button>
    </div>
  </section>

  <!-- 2. 기록 시작 전 -->
  <section class="hidden" id="vReady" style="flex:1;display:flex;flex-direction:column;gap:14px;min-height:0">
    <div class="who">기록자 <b id="whoName"></b><button class="chg" id="chg">바꾸기</button></div>
    <div class="setup" id="setupReady"></div>
    <button class="big start" id="btnStart">
      <span class="main">기록 시작</span>
      <span class="hint">쿼터 구분은 안 해도 돼요 · 끝날 때까지 켜 두세요</span>
    </button>
    <div class="log" id="logReady"></div>
  </section>

  <!-- 3. 기록 중 -->
  <section class="hidden" id="vRec" style="flex:1;display:flex;flex-direction:column;gap:12px;min-height:0">
    <div class="bar">
      <span class="rec">기록 중</span>
      <span class="elapsed" id="elapsed">00:00</span>
      <span class="cnt" id="cnt"></span>
      <button class="end" id="btnEnd">기록 끝</button>
    </div>
    <div class="cur" id="curLine"></div>
    <div class="panel setup hidden" id="setupRec"></div>
    <div class="goals" id="goals"></div>
    <div class="amend hidden" id="amend">
      <div class="head"><span id="amTeam" class="tchip"></span><span id="amText"></span><span class="left" id="amLeft"></span></div>
      <div class="timer" id="amTimer"></div>
      <div class="opts">
        <button id="am3">3점</button>
        <button id="amFT">자유투</button>
        <button id="am1">+1 앤드원</button>
        <button id="amX" class="cancel">취소</button>
      </div>
    </div>
    <div class="others" id="others"></div>
    <div class="log" id="log"></div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
// 앱 안 브라우저(카톡 등)는 닫으면 기록자 · 대기 기록이 지워질 수 있고 화면 꺼짐 방지도 안 된다 → 기본 브라우저로 넘긴다
(() => {
  const ua = navigator.userAgent;
  if (/KAKAOTALK/i.test(ua)) {
    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
  } else if (/Android/i.test(ua) && /; wv\)/.test(ua)) {
    const u = location.href.replace(/^https?:\/\//, '');
    document.addEventListener('DOMContentLoaded', () => {
      const a = document.createElement('a');
      a.href = 'intent://' + u + '#Intent;scheme=https;package=com.android.chrome;end';
      a.textContent = '앱 안 브라우저예요. 크롬으로 열기';
      a.style.cssText = 'display:block;padding:12px 16px;background:#FFD338;color:#111;font-weight:800;text-align:center;text-decoration:none;border-bottom:3px solid #111';
      document.body.prepend(a);
    });
  }
})();
(() => {
  const SUPABASE_URL = 'https://wfwzxnyelpbgjxlovjgo.supabase.co';
  const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indmd3p4bnllbHBiZ2p4bG92amdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjAzNDM3NDcsImV4cCI6MjA3NTkxOTc0N30.STu6r2vK5ghEBXHXF_IYdJPsjaxc0efUEUn3pbSrAXM';
  const HDR = { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' };
  const $ = id => document.getElementById(id);
  const AMEND_MS = 10000;                                    // 누른 뒤 득점 종류를 고칠 수 있는 시간 (사용자 2026-11-24 「7초」 → 「10초로」)
  const ALL_TEAMS = ['BLK', 'WHT', 'GRY'];
  const TEAM_OF = { '팀블랙': 'BLK', '팀화이트': 'WHT', '팀그레이': 'GRY', '블랙': 'BLK', '화이트': 'WHT', '그레이': 'GRY' };
  // 득점 종류 = 골인 체크 툴 마크의 kind 와 같은 값
  const KLABEL = { '2': '2점', '3': '3점', 'FT': '자유투', '2+1': '앤드원 2+1', '3+1': '앤드원 3+1' };
  const KSHORT = { '2': '2', '3': '3', 'FT': 'FT', '2+1': '2+1', '3+1': '3+1' };
  const KORDER = ['2', '3', 'FT', '2+1', '3+1'];
  const kText = t => t.sk === 'FT' && t.ft > 1 ? `자유투 ×${t.ft}` : KLABEL[t.sk || '2'];
  const kShort = t => t.sk === 'FT' && t.ft > 1 ? `FT×${t.ft}` : KSHORT[t.sk || '2'];
  const kClass = t => 'k' + (t.sk || '2').replace('+', '');

  // ---------- 저장 (localStorage 가 막혀도 페이지는 돈다) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
    'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));

  const device = store.get('goal_device', null) || uuid();
  store.set('goal_device', device);

  // ---------- 날짜 · 시각 (한국 시간) ----------
  const kst = ms => new Date(ms + 9 * 3600e3);
  const kstDate = ms => kst(ms).toISOString().slice(0, 10);
  const hms = ms => kst(ms).toISOString().slice(11, 19);
  const mmss = ms => { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(s % 60).padStart(2, '0'); };
  const WD = ['일', '월', '화', '수', '목', '금', '토'];

  // ---------- 시계 보정 (서버 - 폰) ----------
  let offset = store.get('goal_offset', { ms: 0, rtt: null }).ms, rtt = null;
  const serverNow = () => Date.now() + offset;
  async function syncClock() {
    let best = null;
    for (let i = 0; i < 3; i++) {
      try {
        const t0 = Date.now();
        const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/ercc_server_now', { method: 'POST', headers: HDR, body: '{}' });
        const t1 = Date.now();
        if (!r.ok) continue;
        const s = await r.json();
        const cand = { ms: Math.round(s - (t0 + t1) / 2), rtt: t1 - t0 };
        if (!best || cand.rtt < best.rtt) best = cand;
      } catch {}
    }
    if (best) { offset = best.ms; rtt = best.rtt; store.set('goal_offset', best); online(true); }
    else online(false);
  }

  // ---------- 상태 ----------
  // st = { date, recorder, other, spot: 'CAM'|'SB'|'?'|null, left, right, running, startAt,
  //        taps: [{uuid, team, side, pair: [L, R], spot, sk, ft, at, sent, del}] }
  // spot = 기록자가 선 편 (CAM 카메라 쪽 = 스코어보드 맞은편 · SB 스코어보드 쪽) · left/right = 그 자리에서 본 왼쪽/오른쪽 팀
  // 2026-11-24 개편 전 상태(q · qStart · kind)는 버린다 - 그날 기록은 이미 서버에 있다
  let st = store.get('goal_state', null);
  const today = kstDate(serverNow());
  if (!st || st.date !== today || !('left' in st)) {
    st = { date: today, recorder: st && st.recorder, other: st && st.other, spot: null, left: null, right: null, running: false, startAt: null,
           taps: (st && st.date === today && Array.isArray(st.taps)) ? st.taps.filter(t => t.kind === 'goal' || t.team) : [] };
  }
  const save = () => store.set('goal_state', st);
  save();

  // ---------- 보내기 줄 (끊겨도 쌓아 뒀다가 다시 보낸다) ----------
  let queue = store.get('goal_queue', []);
  const saveQ = () => store.set('goal_queue', queue);
  let flushing = false;
  async function rpc(fn, body) {
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, { method: 'POST', headers: HDR, body: JSON.stringify(body) });
    if (!r.ok) { const e = new Error(await r.text()); e.status = r.status; throw e; }
    return r.json();
  }
  async function flush() {
    if (flushing || !queue.length) { paintSync(); return; }
    flushing = true;
    try {
      while (queue.length) {
        const op = queue[0];
        try {
          if (op.op === 'tap') {
            const t = st.taps.find(x => x.uuid === op.uuid);
            // 아직 안 보낸 탭은 보내는 순간의 팀 · 종류로 보낸다 (10초 고치기가 끝나기 전에 보내도 뒤에 edit 가 따라간다)
            await rpc('ercc_goal_tap', {
              p_tap_uuid: op.uuid, p_device: device, p_kind: op.kind || 'goal', p_recorder: op.recorder, p_other: !!op.other,
              p_client_ms: op.client, p_offset_ms: op.offset, p_rtt_ms: op.rtt, p_ua: navigator.userAgent,
              p_team: t ? t.team : op.team || null, p_score_kind: t ? t.sk : op.sk || null, p_ft: t ? (t.ft || null) : null,
              p_side: t ? t.side : null, p_spot: t && t.spot !== '?' ? t.spot : null });
            if (t) { t.sent = true; t.sentSig = sig(t); }
          } else if (op.op === 'edit') {
            const t = st.taps.find(x => x.uuid === op.uuid);
            if (t && !t.del && t.sentSig !== sig(t)) {
              await rpc('ercc_goal_edit', { p_tap_uuid: t.uuid, p_device: device, p_team: t.team, p_score_kind: t.sk, p_ft: t.ft || null, p_side: t.side });
              t.sentSig = sig(t);
            }
          } else if (op.op === 'undo') {
            await rpc('ercc_goal_undo', { p_tap_uuid: op.uuid, p_device: device });
          }
          queue.shift(); saveQ(); save(); online(true);
        } catch (e) {
          if (e.status === 400) { queue.shift(); saveQ(); continue; }   // 서버가 거절한 건 다시 보내도 같다
          online(false); break;
        }
      }
    } finally { flushing = false; paintLog(); paintSync(); }
  }
  const sig = t => `${t.team}|${t.side}|${t.sk}|${t.ft || ''}`;
  setInterval(flush, 3000);
  addEventListener('online', flush);

  let isOnline = null;
  function online(v) { isOnline = v; paintSync(); }
  function paintSync() {
    const dot = $('dot'), txt = $('syncTxt');
    const n = queue.length;
    if (isOnline === false) { dot.className = 'dot off'; txt.textContent = n ? `연결 끊김 · 대기 ${n}` : '연결 끊김'; }
    else if (n) { dot.className = 'dot wait'; txt.textContent = `보내는 중 ${n}`; }
    else { dot.className = 'dot'; txt.textContent = isOnline ? '저장됨' : '연결 확인 중'; }
  }

  // ---------- 기록 ----------
  function recordGoal(side) {
    const client = Date.now();
    const t = { uuid: uuid(), team: side === 'L' ? st.left : st.right, side, pair: [st.left, st.right], spot: st.spot,
                sk: '2', ft: null, at: client + offset, sent: false, del: false };
    st.taps.push(t); save();
    queue.push({ op: 'tap', uuid: t.uuid, kind: 'goal', recorder: st.recorder, other: st.other, client, offset, rtt });
    saveQ(); flush();
    return t;
  }
  function editTap(t) {               // 팀 · 종류를 바꿨다 → 보낸 뒤면 edit 를 줄에 (보내기 전이면 보낼 때 새 값으로 간다)
    save();
    if (!queue.some(o => o.op === 'edit' && o.uuid === t.uuid)) queue.push({ op: 'edit', uuid: t.uuid });
    saveQ(); flush();
  }
  function removeTap(t) {
    t.del = true; save();
    const i = queue.findIndex(o => o.op === 'tap' && o.uuid === t.uuid);
    if (i >= 0) { queue = queue.filter(o => o.uuid !== t.uuid); }   // 아직 안 보낸 것은 줄에서 빼기만
    else { queue = queue.filter(o => !(o.op === 'edit' && o.uuid === t.uuid)); queue.push({ op: 'undo', uuid: t.uuid }); }
    saveQ(); flush();
  }

  // ---------- 화면 ----------
  let toastTimer;
  function toast(msg) {
    const el = $('toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 900);
  }
  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }
  const chip = team => `<span class="tchip ${team || 'none'}">${team || '팀?'}</span>`;

  function show() {
    const d = kst(serverNow());
    $('today').textContent = `${String(d.getUTCFullYear()).slice(2)}.${d.getUTCMonth() + 1}.${d.getUTCDate()} (${WD[d.getUTCDay()]})`;
    const v = !st.recorder ? 'pick' : st.running ? 'rec' : 'ready';
    $('vPick').classList.toggle('hidden', v !== 'pick');
    $('vReady').classList.toggle('hidden', v !== 'ready');
    $('vRec').classList.toggle('hidden', v !== 'rec');
    if (v === 'pick') { loadRoster(); return; }
    $('whoName').textContent = st.recorder + (st.other ? ' (기타)' : '');
    if (!st.left || !st.right) { [st.left, st.right] = defaultTeams(); save(); }
    if (v === 'ready') paintSetup($('setupReady'));
    if (v === 'rec') { $('setupRec').classList.add('hidden'); paintCur(); paintGoals(); }
    disarmEnd(); closeAmend();
    paintLog(); tick(); wake();
  }

  // 왼쪽/오른쪽 팀 기본값 = 명단 팀 칸의 앞 두 팀 (없으면 BLK · WHT)
  function defaultTeams() {
    const c = store.get('goal_roster', null);
    const ts = c && c.teams ? ALL_TEAMS.filter(x => c.teams.includes(x)) : [];
    return ts.length >= 2 ? ts.slice(0, 2) : ['BLK', 'WHT'];
  }
  const SPOT = { CAM: '카메라 쪽', SB: '스코어보드 쪽', '?': '자리 모름' };
  // 자리 · 좌우 팀 고르기 (준비 화면과 기록 중 「바꾸기」 판이 같이 쓴다)
  function paintSetup(box, onDone) {
    box.innerHTML = `
      <span class="lbl">1. 내가 선 자리</span>
      <div class="spots">
        <button data-s="CAM">카메라 쪽<small>스코어보드 맞은편</small></button>
        <button data-s="SB">스코어보드 쪽<small>카메라 맞은편</small></button>
        <button class="unk" data-s="?">잘 모르겠음</button>
      </div>
      <span class="lbl">2. 내 자리에서 본 팀</span>
      <div class="sides">
        <div class="col" data-side="L"><span>◀ 내 왼쪽</span></div>
        <div class="col" data-side="R"><span>내 오른쪽 ▶</span></div>
      </div>
      <span class="help">골 버튼이 이 순서대로 놓여요. 코트를 바꾸면 기록 중 「⇄ 좌우」, 게임이 바뀌면 「설정」에서 고쳐요.</span>
      ${onDone ? '<button class="done">확인</button>' : ''}`;
    box.querySelectorAll('.spots button').forEach(b => {
      b.classList.toggle('on', st.spot === b.dataset.s);
      b.onclick = () => { st.spot = b.dataset.s; save(); paintSetup(box, onDone); };
    });
    box.querySelectorAll('.sides .col').forEach(col => {
      const side = col.dataset.side;
      ALL_TEAMS.forEach(tm => {
        const b = document.createElement('button'); b.className = tm; b.textContent = tm;
        b.classList.toggle('on', (side === 'L' ? st.left : st.right) === tm);
        b.onclick = () => {
          const other = side === 'L' ? st.right : st.left, mine = side === 'L' ? st.left : st.right;
          if (tm === other) { if (side === 'L') { st.left = tm; st.right = mine; } else { st.right = tm; st.left = mine; } }  // 맞은편 팀을 고르면 서로 바꾼다
          else if (side === 'L') st.left = tm; else st.right = tm;
          save(); paintSetup(box, onDone);
        };
        col.appendChild(b);
      });
    });
    if (onDone) box.querySelector('.done').onclick = onDone;
  }
  function paintCur() {
    const el = $('curLine');
    el.innerHTML = `<span>${SPOT[st.spot] || '자리 미정'}</span><span>·</span>${chip(st.left)}<span>|</span>${chip(st.right)}`
      + `<span class="sp"></span><button id="btnSwap">⇄ 좌우</button><button id="btnSet">설정</button>`;
    const sw = $('btnSwap');
    sw.onclick = () => {                               // 코트를 바꿨을 때 · 잘못 누르지 않게 두 번
      if (!sw.classList.contains('arm')) {
        sw.classList.add('arm'); sw.textContent = '바꿀까요?';
        setTimeout(() => { if (sw.isConnected) { sw.classList.remove('arm'); sw.textContent = '⇄ 좌우'; } }, 3000);
        return;
      }
      [st.left, st.right] = [st.right, st.left]; save(); toast(`◀ ${st.left} | ${st.right} ▶`); paintCur(); paintGoals();
    };
    $('btnSet').onclick = () => {
      const box = $('setupRec');
      if (!box.classList.contains('hidden')) { box.classList.add('hidden'); return; }
      box.classList.remove('hidden');
      paintSetup(box, () => { box.classList.add('hidden'); paintCur(); paintGoals(); });
    };
  }
  function paintGoals() {
    const box = $('goals'); box.innerHTML = ''; box.className = 'goals n2';
    [['L', st.left], ['R', st.right]].forEach(([side, tm]) => {
      const b = document.createElement('button');
      b.className = 'gbtn ' + tm;
      b.innerHTML = `<span class="tn">${tm}</span><span class="gl">골!</span><span class="sm">${side === 'L' ? '◀ 내 왼쪽' : '내 오른쪽 ▶'}</span>`;
      b.addEventListener('pointerdown', e => { e.preventDefault(); onGoal(side, b); });
      box.appendChild(b);
    });
  }

  function paintLog() {
    if (!st.recorder) return;
    const el = st.running ? $('log') : $('logReady');
    const live = st.taps.filter(t => !t.del);
    // 기록 중이면 이번 기록(시작 뒤)만, 아니면 오늘 전부 (최근 것이 위)
    const rows = live.filter(t => !st.running || t.at >= (st.startAt || 0)).slice().reverse();
    $('cnt').textContent = st.running ? `골 ${live.filter(t => t.at >= (st.startAt || 0)).length}` : '';
    if (!rows.length) { el.innerHTML = `<div class="empty">${st.running ? '아직 골 기록 없음' : '오늘 기록 없음'}</div>`; return; }
    el.innerHTML = st.running ? '' : `<div class="day">오늘 기록 ${rows.length}개 · 팀 · 종류를 눌러 고칠 수 있어요</div>`;
    rows.forEach(t => {
      const n = live.indexOf(t) + 1;
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = `<span class="n">${n}</span>${chip(t.team)}<span class="kchip ${kClass(t)}">${kShort(t)}</span>`
        + `<span class="t">${hms(t.at)}</span>`
        + (st.running && st.startAt ? `<span class="e">+${mmss(t.at - st.startAt)}</span>` : '')
        + (t.sent ? '' : '<span class="st">대기</span>');
      // 팀 칩 = 반대편 팀으로 (누를 때의 좌우 짝 안에서) · 종류 칩 = 2 → 3 → FT → 2+1 → 3+1
      row.querySelector('.tchip').onclick = () => {
        const pair = t.pair || [st.left, st.right];
        t.side = t.side === 'L' ? 'R' : 'L'; t.team = t.side === 'L' ? pair[0] : pair[1];
        editTap(t); paintLog(); if (amendT === t) paintAmend();
      };
      row.querySelector('.kchip').onclick = () => {
        t.sk = KORDER[(KORDER.indexOf(t.sk || '2') + 1) % KORDER.length]; t.ft = t.sk === 'FT' ? 1 : null;
        editTap(t); paintLog(); if (amendT === t) paintAmend();
      };
      const b = document.createElement('button'); b.className = 'del'; b.textContent = '삭제';
      b.onclick = () => {
        if (!b.classList.contains('arm')) {
          b.classList.add('arm'); b.textContent = '삭제?';
          setTimeout(() => { if (b.isConnected) { b.classList.remove('arm'); b.textContent = '삭제'; } }, 3000);
          return;
        }
        removeTap(t); if (amendT === t) closeAmend();
        toast('골 삭제'); paintLog();
      };
      row.appendChild(b);
      el.appendChild(row);
    });
  }

  // ---------- 누른 뒤 10초 고치기 ----------
  // 그 사이 다른 골 버튼(어느 팀이든)을 누르면 새 득점으로 저장하고 고치기 줄은 새 골로 넘어간다 · 앞 골은 아래 기록 줄에서 고친다
  let amendT = null, amendEnd = 0, amendTick = null;
  function openAmend(t) {
    amendT = t; amendEnd = Date.now() + AMEND_MS;
    $('amend').classList.remove('hidden'); paintAmend();
    clearInterval(amendTick); amendTick = setInterval(stepAmend, 100); stepAmend();
  }
  function stepAmend() {
    const left = amendEnd - Date.now();
    if (left <= 0 || !amendT) { closeAmend(); return; }
    $('amTimer').style.transform = `scaleX(${left / AMEND_MS})`;
    $('amLeft').textContent = `${Math.ceil(left / 1000)}초`;
  }
  function closeAmend() { amendT = null; clearInterval(amendTick); $('amend').classList.add('hidden'); }
  function paintAmend() {
    const t = amendT; if (!t) return;
    $('amTeam').className = 'tchip ' + t.team; $('amTeam').textContent = t.team;
    $('amText').textContent = `방금 ${kText(t)}`;
    $('am3').classList.toggle('on', t.sk === '3' || t.sk === '3+1');
    $('amFT').classList.toggle('on', t.sk === 'FT');
    $('amFT').textContent = t.sk === 'FT' && t.ft > 1 ? `자유투 ×${t.ft}` : '자유투';
    $('am1').classList.toggle('on', t.sk === '2+1' || t.sk === '3+1');
  }
  function amend(fn) {
    const t = amendT; if (!t) return;
    fn(t); amendEnd = Date.now() + AMEND_MS;          // 고칠 때마다 10초를 다시 준다
    editTap(t); paintAmend(); paintLog(); buzz(30);
  }
  // 3점: 2 ↔ 3 (앤드원이면 2+1 ↔ 3+1)
  $('am3').onclick = () => amend(t => { t.sk = { '2': '3', '3': '2', '2+1': '3+1', '3+1': '2+1', 'FT': '3' }[t.sk || '2']; t.ft = null; });
  // 자유투: 1개 → 2개 → 3개 → 1개 (자유투를 끄려면 3점 · 취소 · 기록 줄의 종류 칩)
  $('amFT').onclick = () => amend(t => { if (t.sk === 'FT') t.ft = (t.ft || 1) % 3 + 1; else { t.sk = 'FT'; t.ft = 1; } });
  // +1 앤드원: 2 ↔ 2+1 · 3 ↔ 3+1
  $('am1').onclick = () => amend(t => { t.sk = { '2': '2+1', '2+1': '2', '3': '3+1', '3+1': '3', 'FT': '2+1' }[t.sk || '2']; t.ft = null; });
  $('amX').onclick = () => { const t = amendT; if (!t) return; removeTap(t); closeAmend(); toast('취소함'); paintLog(); };

  function tick() {
    if (st.running && st.startAt) $('elapsed').textContent = mmss(serverNow() - st.startAt);
  }
  setInterval(tick, 500);

  // 화면 꺼짐 막기 (기록 중)
  let lock = null;
  async function wake() {
    try {
      if (st.running && !lock && 'wakeLock' in navigator) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); }
      if (!st.running && lock) { await lock.release(); lock = null; }
    } catch {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wake(); syncClock().then(flush); } });

  // ---------- 버튼 ----------
  $('btnStart').onclick = () => {
    if (!st.spot) { toast('내가 선 자리를 골라 주세요'); return; }
    st.running = true; st.startAt = serverNow(); save();
    buzz(80); toast('기록 시작'); show();
  };
  const lastGoal = {};
  function onGoal(side, b) {
    const now = Date.now();
    if (now - (lastGoal[side] || 0) < 800) return;    // 손이 두 번 닿은 것
    lastGoal[side] = now;
    const t = recordGoal(side);
    buzz(60); toast(`${t.team} 골`);
    b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 150);
    openAmend(t); paintLog();
  }
  let endTimer;
  function disarmEnd() { const b = $('btnEnd'); b.classList.remove('arm'); b.textContent = '기록 끝'; clearTimeout(endTimer); }
  $('btnEnd').onclick = () => {
    const b = $('btnEnd');
    if (!b.classList.contains('arm')) {
      b.classList.add('arm'); b.textContent = '끝낼까요?'; endTimer = setTimeout(disarmEnd, 3000); return;
    }
    st.running = false; st.startAt = null; save();
    buzz([60, 60, 60]); toast('기록 끝'); show();
  };
  $('chg').onclick = () => { st.recorder = null; st.other = false; save(); show(); };

  // ---------- 명단 ----------
  let rosterLoaded = false;
  async function loadRoster() {
    if (rosterLoaded) { paintNames(store.get('goal_roster', { names: [] }).names); return; }
    const box = $('names'); box.innerHTML = '';
    try {
      // 기록자 = 전체 멤버(ercc_members) + 출전 명단에 한 번이라도 나온 이름 · 가나다순 (사용자 2026-11-24 「전체 명단을 다 뿌려줘」)
      const [rm, rr] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/ercc_members?select=name`, { headers: HDR }),
        fetch(`${SUPABASE_URL}/rest/v1/ercc_roster?select=name,team,game_date&game_date=lte.${today}&order=game_date.desc&limit=2000`, { headers: HDR }),
      ]);
      if (!rm.ok || !rr.ok) throw new Error('roster');
      const members = await rm.json(), roster = await rr.json();
      const names = [...new Set([...members.map(x => x.name), ...roster.map(x => x.name)].map(n => (n || '').trim()).filter(Boolean))]
        .sort((x, y) => x.localeCompare(y, 'ko'));
      // 왼쪽/오른쪽 팀 기본값은 가장 최근 출전 명단의 팀 칸에서
      const lastDate = roster.length ? roster[0].game_date : null;
      const teams = [...new Set(roster.filter(x => x.game_date === lastDate).map(x => TEAM_OF[(x.team || '').trim()]).filter(Boolean))];
      $('rosterSub').textContent = `전체 ${names.length}명 · 가나다순`;
      store.set('goal_roster', { date: lastDate, names, teams });
      rosterLoaded = true; paintNames(names);
    } catch {
      const c = store.get('goal_roster', null);   // 연결이 안 되면 지난번 받아 둔 명단
      $('rosterSub').textContent = c ? '연결 끊김 · 지난번 받은 명단' : '연결 끊김 · 「기타」로 이름을 넣어 주세요';
      paintNames(c ? c.names : []);
    }
  }
  function paintNames(names) {
    const box = $('names'); box.innerHTML = '';
    names.forEach(n => {
      const b = document.createElement('button'); b.textContent = n;
      b.onclick = () => { st.recorder = n; st.other = false; save(); show(); };
      box.appendChild(b);
    });
    const o = document.createElement('button'); o.className = 'other'; o.textContent = '기타 (명단에 없음 · 직접 입력)';
    o.onclick = () => { $('otherBox').classList.remove('hidden'); $('otherName').focus(); };
    box.appendChild(o);
  }
  function takeOther() {
    const v = $('otherName').value.trim();
    if (!v) { $('otherName').focus(); return; }
    st.recorder = v.slice(0, 20); st.other = true; save(); show();
  }
  $('otherOk').onclick = takeOther;
  $('otherName').addEventListener('keydown', e => { if (e.key === 'Enter') takeOther(); });

  // ---------- 다른 기록자 ----------
  async function others() {
    if (!st.recorder) return;
    try {
      const list = await rpc('ercc_goal_list', { p_date: today, p_device: device });
      const names = [...new Set(list.filter(x => !x.mine).map(x => x.recorder))];
      $('others').textContent = names.length ? `함께 기록 중: ${names.join(', ')}` : '';
      online(true);
    } catch { online(false); }
  }
  setInterval(others, 20000);
  setInterval(syncClock, 5 * 60e3);

  // 명단(팀)을 미리 받아 둔다 - 기록자를 이미 고른 폰도 오늘 팀 기본값을 알 수 있게
  if (st.recorder && !st.running && !store.get('goal_roster', null)) loadRoster().then(() => { [st.left, st.right] = defaultTeams(); save(); show(); });
  show();
  syncClock().then(() => { flush(); others(); });
})();
</script>
</body>
</html>
